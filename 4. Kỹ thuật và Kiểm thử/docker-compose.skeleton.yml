# Khung môi trường phát triển đồng nhất cho nhóm 4 người (GearForge - EC312)
# Lưu ý: Copy file này thành docker-compose.yml và tạo file .env trước khi chạy:
#   docker compose up -d

services:
  db:
    image: mysql:8.0
    container_name: gearforge_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${GF_DB_NAME:-gearforge_db}
      MYSQL_USER: ${GF_DB_USER:-gf_user}
      MYSQL_PASSWORD: ${GF_DB_PASSWORD:-change_me_local_db_pass}
      MYSQL_ROOT_PASSWORD: ${GF_DB_ROOT_PASSWORD:-change_me_local_root_pass}
    volumes:
      - gf_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gearforge_net

  wordpress:
    image: wordpress:php8.2-apache
    container_name: gearforge_wp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GF_WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${GF_DB_NAME:-gearforge_db}
      WORDPRESS_DB_USER: ${GF_DB_USER:-gf_user}
      WORDPRESS_DB_PASSWORD: ${GF_DB_PASSWORD:-change_me_local_db_pass}
      WORDPRESS_TABLE_PREFIX: wp_
      # Khóa mã hóa AES-256 dùng riêng cho ảnh CCCD/Thẻ SV (NĐ 13/2023) - đặt trong .env
      GF_VAULT_ENCRYPTION_KEY: ${GF_VAULT_ENCRYPTION_KEY:-replace_with_32_byte_hex_key_in_env}
      GF_VAULT_DIR: /var/www/gf-vault
    volumes:
      - gf_wp_data:/var/www/html
      # Mount Custom Plugin của nhóm để cả 4 thành viên cùng code & test qua Git
      - ./plugins/gearforge-core:/var/www/html/wp-content/plugins/gearforge-core
      # Mount Child Theme giao diện GearForge (Role 3 phụ trách)
      - ./themes/gearforge-child:/var/www/html/wp-content/themes/gearforge-child
      # Thư mục lưu hồ sơ CCCD/Thẻ SV đã mã hóa nằm NGOÀI /var/www/html để chặn truy cập URL công khai
      - ./gf-vault:/var/www/gf-vault
    networks:
      - gearforge_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: gearforge_pma
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GF_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${GF_DB_USER:-gf_user}
      PMA_PASSWORD: ${GF_DB_PASSWORD:-change_me_local_db_pass}
      UPLOAD_LIMIT: 64M
    networks:
      - gearforge_net

volumes:
  gf_db_data:
  gf_wp_data:

networks:
  gearforge_net:
    driver: bridge
