    <line x1="76" y1="100" x2="116" y2="230" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="76" y1="100" x2="76" y2="235" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <rect x="22" y="34" width="108" height="68" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="3.5"/>
    <circle cx="122" cy="68" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="122" cy="68" r="14" fill="#22d3ee" opacity="0.7" filter="url(#neon-glow)"/>
    <circle cx="42" cy="48" r="6" fill="#ef4444" filter="url(#neon-glow)"/>
  </g>
  <ellipse cx="256" cy="306" rx="24" ry="17" fill="url(#fur-grad)" stroke="#1e1b4b" stroke-width="3.5"/>
</svg>
