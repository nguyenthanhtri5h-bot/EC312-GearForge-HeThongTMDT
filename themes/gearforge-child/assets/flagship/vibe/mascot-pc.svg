<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <radialGradient id="bg-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur-grad" x1="25%" y1="10%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#b4c6fc"/>
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0057ff"/>
    </linearGradient>
    <linearGradient id="goggle-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
  <circle cx="240" cy="255" r="215" fill="url(#bg-aura)"/>

  <!-- Custom Watercooled Tower PC on right -->
  <g transform="translate(248, 128)">
    <rect x="0" y="0" width="176" height="278" rx="18" fill="#0f172a" stroke="url(#goggle-frame)" stroke-width="4"/>
    <rect x="16" y="18" width="144" height="214" rx="12" fill="#13172e" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <!-- RGB Fans -->
    <circle cx="52" cy="64" r="24" fill="#1e1b4b" stroke="#22d3ee" stroke-width="3.5" filter="url(#neon-glow)"/>
    <circle cx="52" cy="64" r="8" fill="#67e8f9"/>
    <circle cx="52" cy="126" r="24" fill="#1e1b4b" stroke="#a855f7" stroke-width="3.5" filter="url(#neon-glow)"/>
    <circle cx="52" cy="126" r="8" fill="#e879f9"/>
    <!-- GPU Card -->
    <rect x="74" y="156" width="76" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="82" y1="168" x2="140" y2="168" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <!-- RAM -->
    <rect x="104" y="42" width="10" height="52" rx="3" fill="#38bdf8"/>
    <rect x="120" y="42" width="10" height="52" rx="3" fill="#c084fc"/>
    <rect x="136" y="42" width="10" height="52" rx="3" fill="#38bdf8"/>
    <text x="88" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="13" fill="#93c5fd">GEARFORGE RTX</text>
  </g>

  <!-- Bear on left -->
  <path d="M62 290 C62 236 106 220 164 220 C222 220 264 236 264 290 L272 396 C272 410 256 420 236 420 L90 420 C70 420 54 410 54 396 Z" fill="url(#hoodie-grad)" stroke="#8b5cf6" stroke-width="3.5"/>
  
  <g transform="translate(164,158) scale(0.9)">
    <!-- Ears -->
    <circle cx="-68" cy="-58" r="32" fill="url(#fur-grad)" stroke="#312e81" stroke-width="4"/>
    <circle cx="-68" cy="-58" r="17" fill="#818cf8" opacity="0.55"/>
    <circle cx="68" cy="-58" r="32" fill="url(#fur-grad)" stroke="#312e81" stroke-width="4"/>
    <circle cx="68" cy="-58" r="17" fill="#818cf8" opacity="0.55"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="88" ry="76" fill="url(#fur-grad)" stroke="#1e1b4b" stroke-width="4"/>
    <!-- Cheek shading -->
    <ellipse cx="-52" cy="18" rx="16" ry="9" fill="#c7d2fe" opacity="0.65"/>
    <ellipse cx="52" cy="18" rx="16" ry="9" fill="#c7d2fe" opacity="0.65"/>

    <!-- Forehead cyber goggles (NEVER covering eyes!) -->
    <rect x="-66" y="-66" width="132" height="28" rx="14" fill="#0f172a" stroke="url(#goggle-frame)" stroke-width="3.5"/>
    <rect x="-54" y="-60" width="44" height="16" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="10" y="-60" width="44" height="16" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-44" y1="-55" x2="-24" y2="-55" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="-55" x2="40" y2="-55" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bright Cyan Anime Eyes -->
    <ellipse cx="-32" cy="-4" rx="13" ry="15" fill="#0f172a"/>
    <ellipse cx="-32" cy="-3" rx="9" ry="11" fill="#22d3ee" filter="url(#neon-glow)"/>
    <circle cx="-35" cy="-7" r="4" fill="#ffffff"/>
    <circle cx="-28" cy="2" r="2" fill="#e0f2fe"/>

    <ellipse cx="32" cy="-4" rx="13" ry="15" fill="#0f172a"/>
    <ellipse cx="32" cy="-3" rx="9" ry="11" fill="#22d3ee" filter="url(#neon-glow)"/>
    <circle cx="29" cy="-7" r="4" fill="#ffffff"/>
    <circle cx="36" cy="2" r="2" fill="#e0f2fe"/>

    <!-- Snout & friendly grin -->
    <ellipse cx="0" cy="24" rx="30" ry="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <ellipse cx="0" cy="17" rx="11" ry="7.5" fill="#1e1b4b"/>
    <path d="M-12 31 Q0 41 12 31" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Fiber / coolant cable held by paw -->
  <path d="M214 334 C250 334 252 296 290 296" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" filter="url(#neon-glow)"/>
  <ellipse cx="212" cy="334" rx="24" ry="17" fill="url(#fur-grad)" stroke="#1e1b4b" stroke-width="3.5"/>
  <ellipse cx="102" cy="350" rx="22" ry="16" fill="url(#fur-grad)" stroke="#1e1b4b" stroke-width="3.5"/>
</svg>
