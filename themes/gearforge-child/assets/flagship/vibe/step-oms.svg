  <text x="38" y="688" font-family="system-ui,sans-serif" font-weight="700" font-size="12.5" fill="#34d399">✓ 1-Đổi-1 30 ngày · Máy mượn khi bảo hành</text>

  <rect x="20" y="734" width="350" height="54" rx="18" fill="url(#ph-accent)"/>
