  <circle cx="48" cy="334" r="8" fill="#10b981"/><text x="72" y="339" font-family="system-ui,sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">2. Xuất kho &amp; Quét mã Serial (S/N)</text>
