<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </radialGradient>
    <linearGradient id="aluFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#273142"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B3445"/>
      <stop offset="100%" stop-color="#141A24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#studioBg)"/>

  <!-- 75% Mechanical Keyboard -->
  <g transform="translate(88, 128) rotate(-6)" filter="url(#softShadow)">
    <rect x="0" y="0" width="430" height="214" rx="18" fill="url(#aluFrame)" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="12" width="406" height="190" rx="11" fill="#0B1019"/>

    <!-- Function Row -->
    <rect x="20" y="20" width="24" height="24" rx="5" fill="#0057FF"/>
    <g fill="#334155">
      <rect x="52" y="20" width="24" height="24" rx="5"/><rect x="80" y="20" width="24" height="24" rx="5"/><rect x="108" y="20" width="24" height="24" rx="5"/><rect x="136" y="20" width="24" height="24" rx="5"/>
      <rect x="172" y="20" width="24" height="24" rx="5"/><rect x="200" y="20" width="24" height="24" rx="5"/><rect x="228" y="20" width="24" height="24" rx="5"/><rect x="256" y="20" width="24" height="24" rx="5"/>
      <rect x="292" y="20" width="24" height="24" rx="5"/><rect x="320" y="20" width="24" height="24" rx="5"/><rect x="348" y="20" width="24" height="24" rx="5"/>
    </g>
    <circle cx="394" cy="32" r="12" fill="#475569" stroke="#64748B" stroke-width="2"/>

    <!-- Number Row -->
    <g fill="#1E293B">
      <rect x="20" y="54" width="24" height="24" rx="5"/><rect x="48" y="54" width="24" height="24" rx="5"/><rect x="76" y="54" width="24" height="24" rx="5"/><rect x="104" y="54" width="24" height="24" rx="5"/>
      <rect x="132" y="54" width="24" height="24" rx="5"/><rect x="160" y="54" width="24" height="24" rx="5"/><rect x="188" y="54" width="24" height="24" rx="5"/><rect x="216" y="54" width="24" height="24" rx="5"/>
      <rect x="244" y="54" width="24" height="24" rx="5"/><rect x="272" y="54" width="24" height="24" rx="5"/><rect x="300" y="54" width="24" height="24" rx="5"/><rect x="328" y="54" width="44" height="24" rx="5"/>
      <rect x="382" y="54" width="24" height="24" rx="5" fill="#334155"/>
    </g>

    <!-- QWERTY Row -->
    <g fill="#1E293B">
      <rect x="20" y="84" width="36" height="24" rx="5" fill="#334155"/><rect x="60" y="84" width="24" height="24" rx="5"/><rect x="88" y="84" width="24" height="24" rx="5"/><rect x="116" y="84" width="24" height="24" rx="5"/>
      <rect x="144" y="84" width="24" height="24" rx="5"/><rect x="172" y="84" width="24" height="24" rx="5"/><rect x="200" y="84" width="24" height="24" rx="5"/><rect x="228" y="84" width="24" height="24" rx="5"/>
      <rect x="256" y="84" width="24" height="24" rx="5"/><rect x="284" y="84" width="24" height="24" rx="5"/><rect x="312" y="84" width="24" height="24" rx="5"/><rect x="340" y="84" width="32" height="24" rx="5"/>
      <rect x="382" y="84" width="24" height="24" rx="5" fill="#334155"/>
    </g>

    <!-- ASDF Row -->
    <g fill="#1E293B">
      <rect x="20" y="114" width="44" height="24" rx="5" fill="#334155"/><rect x="68" y="114" width="24" height="24" rx="5"/><rect x="96" y="114" width="24" height="24" rx="5"/><rect x="124" y="114" width="24" height="24" rx="5"/>
      <rect x="152" y="114" width="24" height="24" rx="5"/><rect x="180" y="114" width="24" height="24" rx="5"/><rect x="208" y="114" width="24" height="24" rx="5"/><rect x="236" y="114" width="24" height="24" rx="5"/>
      <rect x="264" y="114" width="24" height="24" rx="5"/><rect x="292" y="114" width="24" height="24" rx="5"/><rect x="320" y="114" width="52" height="24" rx="5" fill="#0057FF"/>
      <rect x="382" y="114" width="24" height="24" rx="5" fill="#334155"/>
    </g>

    <!-- Bottom Row -->
    <g fill="#334155">
      <rect x="20" y="144" width="52" height="24" rx="5"/><rect x="76" y="144" width="24" height="24" rx="5" fill="#1E293B"/><rect x="104" y="144" width="24" height="24" rx="5" fill="#1E293B"/>
      <rect x="132" y="144" width="24" height="24" rx="5" fill="#1E293B"/><rect x="160" y="144" width="24" height="24" rx="5" fill="#1E293B"/><rect x="188" y="144" width="24" height="24" rx="5" fill="#1E293B"/>
      <rect x="216" y="144" width="24" height="24" rx="5" fill="#1E293B"/><rect x="244" y="144" width="24" height="24" rx="5" fill="#1E293B"/><rect x="272" y="144" width="24" height="24" rx="5" fill="#1E293B"/>
      <rect x="300" y="144" width="44" height="24" rx="5"/><rect x="352" y="144" width="24" height="24" rx="5" fill="#475569"/>
    </g>
    <g fill="#334155">
      <rect x="20" y="174" width="32" height="20" rx="5"/><rect x="56" y="174" width="32" height="20" rx="5"/><rect x="92" y="174" width="150" height="20" rx="5" fill="#1E293B"/>
      <rect x="246" y="174" width="32" height="20" rx="5"/><rect x="282" y="174" width="32" height="20" rx="5"/>
      <rect x="324" y="174" width="24" height="20" rx="5" fill="#475569"/><rect x="352" y="174" width="24" height="20" rx="5" fill="#475569"/><rect x="380" y="174" width="24" height="20" rx="5" fill="#475569"/>
    </g>
  </g>

  <!-- Wireless Ergonomic Mouse -->
  <g transform="translate(570, 152) rotate(8)" filter="url(#softShadow)">
    <rect x="0" y="0" width="120" height="208" rx="56" fill="url(#mouseBody)" stroke="#334155" stroke-width="2"/>
    <path d="M60 4 V78" stroke="#0B1019" stroke-width="2"/>
    <path d="M10 78 H110" stroke="#0B1019" stroke-width="2"/>
    <rect x="53" y="28" width="14" height="32" rx="7" fill="#0057FF"/>
    <rect x="58" y="34" width="4" height="20" rx="2" fill="#93C5FD"/>
  </g>
</svg>
